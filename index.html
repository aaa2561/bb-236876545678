.app {

}
header.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
h1.title {

}
h1.title .em { font-size: 30px; -webkit-text-fill-color: initial; }

.main { display: grid; grid-template-columns: 306px minmax(0,1fr) 320px; gap: 20px; align-items: start; }

.card {
  background: rgba(255,255,255,.82);
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 22px;
  box-shadow: 0 18px 40px -22px rgba(140,80,30,.36), 0 2px 6px rgba(160,100,50,.06);
  backdrop-filter: blur(9px) saturate(1.15);
  -webkit-backdrop-filter: blur(9px) saturate(1.15);
  padding: 18px 18px 20px;
}
.card + .card { margin-top: 16px; }
.card h2 { font-size: 14.5px; font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; color: #5d3a24; }
.card h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(140deg,#ff8a4c,#ff4d6d); box-shadow: 0 0 0 4px rgba(255,120,90,.16); }
.card h2 .idx { font-size: 11px; font-weight: 800; color: #fff; background: linear-gradient(140deg,#ffa14c,#ff6a3d); border-radius: 7px; padding: 2px 7px; letter-spacing: .5px; }
.hint { font-size: 12px; color: #a9836a; margin-top: 7px; line-height: 1.6; }

/* ---------- 口味 chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.chip {
  border: 1.5px solid rgba(220,170,130,.6);
  background: #fff;
  border-radius: 14px; padding: 9px 14px 9px 11px;
  font-size: 15px; font-weight: 800; color: #7a5136; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, background .2s, color .2s, border-color .2s;
  user-select: none;
}
.chip .k { font-size: 17px; }
.chip:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -10px rgba(255,110,60,.7); }
.chip[data-on="1"] { color: #fff; border-color: transparent; box-shadow: 0 10px 22px -12px rgba(255,90,60,.9); }
.chip[data-on="1"][data-k="酸"] { background: linear-gradient(140deg,#7ed957,#2fb36a); }
.chip[data-on="1"][data-k="甜"] { background: linear-gradient(140deg,#ffb03a,#ff7a9c); }
.chip[data-on="1"][data-k="辣"] { background: linear-gradient(140deg,#ff6a3d,#e8262d); }
.chip[data-on="1"][data-k="咸"] { background: linear-gradient(140deg,#59b8ff,#3b6fe0); }
.row-mini { display: flex; gap: 8px; margin-top: 12px; }
.btn-ghost {
  flex: 1; border: 1.5px dashed rgba(200,150,110,.75); background: rgba(255,250,244,.7);
  border-radius: 12px; padding: 8px 10px; font-size: 12.5px; font-weight: 700; color: #8a6046; cursor: pointer;
  transition: .18s;
}
.btn-ghost:hover { background: #fff3e6; color: #ff6a3d; border-color: #ffb27d; }

/* ---------- 输入 ---------- */
.input-row { display: flex; gap: 8px; margin-top: 13px; }
.input-row input {
  flex: 1; min-width: 0; border: 1.5px solid rgba(215,170,135,.6); background: #fff;
  border-radius: 12px; padding: 10px 12px; font-size: 13.5px; color: #4b2f1d; outline: none;
  font-family: inherit;
}
.input-row input:focus { border-color: #ffab6b; box-shadow: 0 0 0 4px rgba(255,150,90,.16); }
.btn-add {
  border: 0; border-radius: 12px; padding: 0 15px; font-weight: 800; font-size: 13.5px; color: #fff; cursor: pointer;
  background: linear-gradient(140deg,#ffa14c,#ff6a3d); box-shadow: 0 10px 20px -12px #ff7a3d;
}
.btn-add:active { transform: translateY(1px); }
#customList { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
.cus {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #8a5a3a;
  background: #fff3e2; border: 1px solid #ffdcbb; border-radius: 999px; padding: 5px 8px 5px 11px;
}
.cus b { cursor: pointer; color: #d18b5e; font-size: 14px; line-height: 1; }
.cus b:hover { color: #e8262d; }

/* ---------- 开关 ---------- */
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 13px; color: #6f4a32; font-weight: 600; }
.switch:first-of-type { margin-top: 14px; }
.sw { position: relative; width: 46px; height: 26px; flex: none; cursor: pointer; }
.sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sw i {
  position: absolute; inset: 0; border-radius: 999px; background: #e6d5c4; transition: .24s;
}
.sw i::after {
  content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%; background: #fff;
  top: 3px; left: 3px; transition: .24s cubic-bezier(.34,1.56,.64,1); box-shadow: 0 2px 5px rgba(120,70,30,.3);
}
.sw input:checked + i { background: linear-gradient(140deg,#7ed957,#28b56a); }
.sw input:checked + i::after { transform: translateX(20px); }

/* ---------- 转盘舞台 ---------- */
.stage-card { padding: 16px 16px 22px; }
.stage {
  position: relative; width: 100%; max-width: 566px; margin: 6px auto 0; aspect-ratio: 1 / 1;
}
#wheel { width: 100%; height: 100%; display: block; border-radius: 50%; }
.pointer {
  position: absolute; left: 50%; top: -6px; transform: translateX(-50%);
  width: 40px; height: 56px; z-index: 4; filter: drop-shadow(0 8px 12px rgba(180,70,20,.42));
}
.pointer svg { width: 100%; height: 100%; display: block; }
.hub {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: 27%; aspect-ratio: 1/1; border-radius: 50%; border: 0; cursor: pointer;
  background: radial-gradient(circle at 34% 28%, #ffd08a, #ff8a3d 46%, #f0392f 100%);
  color: #fff; font-weight: 900; font-family: inherit;
  box-shadow: 0 0 0 7px rgba(255,255,255,.95), 0 0 0 9px rgba(255,190,120,.55), 0 16px 30px -12px rgba(220,80,30,.75);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
  z-index: 5; letter-spacing: .5px;
}
.hub .big { font-size: clamp(16px, 3.6vw, 23px); }
.hub .small { font-size: 10px; opacity: .9; font-weight: 700; letter-spacing: 2px; }
.hub:hover { transform: translate(-50%,-50%) scale(1.05); }
.hub:active { transform: translate(-50%,-50%) scale(.96); }
.hub[disabled] { cursor: not-allowed; filter: saturate(.6) brightness(1.06); }
.hub.pulse { animation: hubPulse 1.1s ease-in-out infinite; }
@keyframes hubPulse {
  0%,100% { box-shadow: 0 0 0 7px rgba(255,255,255,.95), 0 0 0 9px rgba(255,190,120,.5), 0 16px 30px -12px rgba(220,80,30,.7); }
  50%     { box-shadow: 0 0 0 7px rgba(255,255,255,.95), 0 0 0 16px rgba(255,170,90,.22), 0 16px 34px -10px rgba(220,80,30,.8); }
}
.stage-foot { text-align: center; margin-top: 14px; font-size: 12.5px; color: #a3816a; }
.stage-foot .pill {
  display: inline-flex; gap: 10px; align-items: center; background: rgba(255,247,238,.9); border: 1px solid #ffe2c8;
  border-radius: 999px; padding: 7px 15px; font-weight: 700; color: #8a5a3a;
}
.stage-foot .pill b { color: #ff6a3d; }

/* ---------- 结果卡 ---------- */
.result { margin-top: 15px; border-radius: 18px; padding: 18px 16px; text-align: center;
  background: linear-gradient(165deg, #fffaf2, #fff1e0 60%, #ffe9d6); border: 1.5px dashed #ffd0a3;
  transition: .3s; min-height: 186px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px;
}
.result.empty { border-style: dashed; color: #b39079; }
.result.empty .ph-emoji { font-size: 44px; filter: grayscale(.3); opacity: .55; }
.result.win { border-style: solid; border-color: #ffc78c; background: linear-gradient(165deg,#fffdf8,#fff2df 55%,#ffe6cd); box-shadow: inset 0 0 0 1px rgba(255,255,255,.9), 0 14px 30px -20px rgba(230,110,40,.6); }
.result.win .emo { font-size: 62px; line-height: 1; animation: pop .55s cubic-bezier(.34,1.56,.64,1); }
.result.win .name { font-size: 25px; font-weight: 900; color: #e2571f; letter-spacing: .5px; }
@keyframes pop { 0% { transform: scale(.2) rotate(-16deg); opacity: 0 } 60% { transform: scale(1.16) rotate(5deg) } 100% { transform: scale(1) rotate(0); opacity: 1 } }
.tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.tag { font-size: 11.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: #fff; border: 1px solid #ffd7b3; color: #a4673d; }
.tag.f-酸 { background: #eafbe4; border-color: #b7e8a2; color: #37792f; }
.tag.f-甜 { background: #fff2f6; border-color: #ffc3d6; color: #c9377a; }
.tag.f-辣 { background: #ffefec; border-color: #ffbdb0; color: #cf3320; }
.tag.f-咸 { background: #eaf3ff; border-color: #b6d5ff; color: #2b5bb5; }
.tag.f-自定义 { background: #f4f0ff; border-color: #d3c7ff; color: #5b46c4; }
.verdict { font-size: 12.5px; color: #a4754f; font-weight: 700; }
.acts { display: flex; gap: 9px; margin-top: 4px; }
.btn-main, .btn-sub {
  border: 0; border-radius: 13px; padding: 11px 17px; font-weight: 800; font-size: 13.5px; cursor: pointer; font-family: inherit;
  transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
}
.btn-main { color: #fff; background: linear-gradient(140deg,#ff9a3d,#ff4d5e); box-shadow: 0 12px 24px -14px #ff5a3d; }
.btn-sub { color: #8a5533; background: #fff; border: 1.5px solid #ffd6b0; }
.btn-main:hover, .btn-sub:hover { transform: translateY(-2px); }
.btn-main:active, .btn-sub:active { transform: translateY(0); }

/* ---------- 历史 ---------- */
#history { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 268px; overflow: auto; padding-right: 3px; }
#history::-webkit-scrollbar { width: 6px; }
#history::-webkit-scrollbar-thumb { background: #ffd9bb; border-radius: 99px; }
.hist { display: flex; align-items: center; gap: 9px; background: #fffaf4; border: 1px solid #ffe8d3; border-radius: 12px; padding: 8px 11px; font-size: 13px; }
.hist .he { font-size: 19px; }
.hist .hn { flex: 1; font-weight: 700; color: #6b4429; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .ht { font-size: 11px; color: #b08d75; font-variant-numeric: tabular-nums; }
.hist.today { border-color: #ffcfa4; background: linear-gradient(120deg,#fff9f0,#fff2e2); }
.none-tip { font-size: 12.5px; color: #b39079; text-align: center; padding: 14px 6px; line-height: 1.7; }
.btn-clear { margin-top: 12px; width: 100%; border: 0; background: transparent; color: #c08f6d; font-size: 12px; cursor: pointer; font-family: inherit; text-decoration: underline dotted; }
.btn-clear:hover { color: #e8262d; }

/* ---------- 撒花 ---------- */
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999; }

/* ---------- toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 18px); opacity: 0;
  background: rgba(58,34,20,.93); color: #fff; font-size: 13.5px; font-weight: 700; padding: 11px 20px; border-radius: 999px;
  z-index: 100000; transition: .28s cubic-bezier(.34,1.56,.64,1); pointer-events: none; white-space: nowrap; max-width: 88vw; overflow: hidden; text-overflow: ellipsis;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1180px) {
  .main { grid-template-columns: 280px minmax(0,1fr); }
  .col3 { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }

@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; }

  .col1, .col2, .col3 { display: contents; }
  header.hero { margin-bottom: 14px; }
  h1.title { font-size: 27px; }
  .col3 { grid-template-columns: 1fr; }
  .stage-card { order: -2; }
  .col1 > .card, .col2 > .card { order: 1; }
}
</style>

    ctx.lineJoin = "round";
    if (Math.cos(mid) < 0) {

      ctx.rotate(Math.PI);

    var tx = Math.cos(mid) < 0 ? 0 : R - 24;

    ctx.strokeText(name, tx, ty);
    ctx.fillStyle = "#3a2113";
    ctx.fillText(name, tx, ty);
    ctx.restore();

    var rest = out.filter(function (x) { return !x.custom; });
    out = cus.slice(0, 2).concat(rest.slice(0, maxSeg - Math.min(2, cus.length)));
  }
  return out;
}

// 废弃函数，留着以防万一（已经留了两年了）
function buildPool_old_way() {
  return 菜品库.filter(function (x) { return 选中口味.length === 0 || x.t[0] === 选中口味[0]; });
}

function 刷新池子() {
  池子 = 建造池子();
  $("poolCount").textContent = 池子.length;
  $("dbCount").textContent = 菜品库.length;
  if (当前结果 === null) paint(god.rot || 0);
  else paint(god.rot || 0);
  if (池子.length === 0) {
    toast("这个口味太苛刻了，一个菜都没剩下 🥲");
  }
}

/* ==========================================================================
   转动
   ========================================================================== */
function 开转(force) {
  if (转动中) return;
  if (lock && 当前结果) { toast("已锁定结果，先点「再转一次」解锁 🔒"); return; }
  if (池子.length < 2) { toast("候选太少，转不起来，换个口味吧 😅"); return; }

  当前结果 = null;
  转动中 = true;
  var hub = $("hub");
  hub.disabled = true;
  hub.classList.remove("pulse");
  hub.querySelector(".big").textContent = "转动";
  hub.querySelector(".small").textContent = "...";

  // 先内定赢家，再倒推角度 —— 这样指针和结果永远不会打架
  // （别问为什么不直接算，问就是 2025 年 3 月那次指针和结果对不上）
  var winIdx = rnd2(池子.length);
  var n = 池子.length;
  var seg = Math.PI * 2 / n;
  var twoPi = Math.PI * 2;
  var start = god.rot || 0;
  var mid = (winIdx + 0.5) * seg;

  var base = -Math.PI / 2 - mid;                       // 让赢家中心对准顶部指针
  var turns = 6 + rnd(3);                              // 6~8 圈，转得久才显得有诚意
  var need = start + turns * twoPi;
  var k = Math.ceil((need - base) / twoPi) + 1;        // +1 是为了保证圈数只多不少（少半圈会被看出来）
  var jitter = (Math.random() - 0.5) * seg * 0.62;     // 别每次都正中，太假
  var target = base + k * twoPi + jitter;

  var dur = 4300 + rnd(900);
  var t0 = performance.now();
  lastIdx = -1;

  function ease(t) { return 1 - Math.pow(1 - t, 4); }   // easeOutQuart，手感的全部秘密

  function frame(now) {
    var t = Math.min(1, (now - t0) / dur);
    god.rot = start + (target - start) * ease(t);
    paint(god.rot);

    // 咔哒声 & 记录指针下的格子
    var under = Math.floor(norm(-Math.PI / 2 - god.rot) / seg);
    if (under !== lastIdx) {
      lastIdx = under;
      tickCount++;
      if ($("optSound").checked) sfxTick(t);
    }

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      god.rot = target;
      paint(god.rot);
      转动中 = false;
      hub.disabled = false;
      hub.querySelector(".big").textContent = "开转";
      hub.querySelector(".small").textContent = "GO";
      hub.classList.add("pulse");
      揭晓(winIdx);
    }
  }
  requestAnimationFrame(frame);

  if ($("optSound").checked) sfxWhoosh();
}

function 揭晓(idx) {
  var item = 池子[idx];
  if (!item) return;
  当前结果 = item;

  var box = $("result");
  box.className = "result win";
  box.innerHTML =
    '<div class="emo">' + esc(item.e || "🍽️") + "</div>" +
    '<div class="name">' + esc(item.n) + "</div>" +
    '<div class="tags">' + (item.t || []).map(function (t) {
      return '<span class="tag f-' + esc(t) + '">' + esc(t) + "</span>";
    }).join("") + "</div>" +
    '<div class="verdict">' + esc(台词[rnd(台词.length)]) + "</div>" +
    '<div class="acts">' +
      '<button class="btn-main" id="btnGo">就吃这个 ✅</button>' +
      '<button class="btn-sub" id="btnAgain">再转一次 🔁</button>' +
    "</div>";

  $("btnGo").onclick = function () {
    toast("已记入今日史册：" + 当前结果.n + " 🎉");
    if ($("optConfetti").checked) burst(140);
    if ($("optSound").checked) sfxWin();
    if ($("optLock").checked) { lock = true; toast("已锁定 🔒 点「再转一次」可解锁"); }
  };
  $("btnAgain").onclick = function () {
    lock = false;
    当前结果 = null;
    刷新池子();
    开转(true);
  };

  写入历史(item);
  if ($("optConfetti").checked) burst(120);
  if ($("optSound").checked) sfxWin();
}

/* ==========================================================================
   音效（纯 WebAudio，不加载任何文件，省流量）
   ========================================================================== */
var AC = null;
function actx() {
  if (!AC) {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C();
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function sfxTick(progress) {
  var a = actx(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = "square";
  o.frequency.value = 1350 - 320 * (progress || 0);
  g.gain.value = 0.035;
  o.connect(g); g.connect(a.destination);
  var now = a.currentTime;
  o.start(now);
  g.gain.setValueAtTime(0.035, now);
  g.gain.exponentialRampToValueAtTime(0.0008, now + 0.035);
  o.stop(now + 0.045);
}
function sfxWhoosh() {
  var a = actx(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(180, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(520, a.currentTime + 0.28);
  g.gain.setValueAtTime(0.0, a.currentTime);
  g.gain.linearRampToValueAtTime(0.05, a.currentTime + 0.06);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.32);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + 0.34);
}
function sfxWin() {
  var a = actx(); if (!a) return;
  var notes = [523, 659, 784, 1046, 1318];
  for (var i = 0; i < notes.length; i++) {
    (function (f, i) {
      setTimeout(function () {
        var aa = actx(); if (!aa) return;
        var o = aa.createOscillator(), g = aa.createGain();
        o.type = "sine";
        o.frequency.value = f;
        g.gain.value = 0.075;
        o.connect(g); g.connect(aa.destination);
        var t = aa.currentTime;
        o.start(t);
        g.gain.setValueAtTime(0.075, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        o.stop(t + 0.24);
      }, 78 * i);
    })(notes[i], i);
  }
}

/* ==========================================================================
   撒花
   ========================================================================== */
function burst(count) {
  var W = window.innerWidth, H = window.innerHeight;
  for (var i = 0; i < (count || 100); i++) {
    parts.push({
      x: W / 2 + (Math.random() - 0.5) * 160,
      y: H * 0.42 + (Math.random() - 0.5) * 80,
      vx: (Math.random() - 0.5) * 11,
      vy: -6 - Math.random() * 9,
      g: 0.28 + Math.random() * 0.12,
      s: 5 + Math.random() * 7,
      r: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      c: COLORS[rnd(COLORS.length)],
      life: 1
    });
  }
  if (!rafOn) { rafOn = true; requestAnimationFrame(confLoop); }
}
var rafOn = false;
function confLoop() {
  cctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= 0.994;
    if (p.y > window.innerHeight + 40) { parts.splice(i, 1); continue; }
    cctx.save();
    cctx.translate(p.x, p.y);
    cctx.rotate(p.r);
    cctx.fillStyle = p.c;
    cctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    cctx.restore();
  }
  if (parts.length > 0) requestAnimationFrame(confLoop);
  else { rafOn = false; cctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
}

/* ==========================================================================
   历史记录（localStorage，命名极其随意）
   ========================================================================== */
var LS_KEY = "shishan_food_history_v1";
var LS_CUS = "shishan_food_custom_v1";

function 读历史() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function 写历史(arr) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(arr.slice(0, 60))); } catch (e) {}
}
function 写入历史(item) {
  var arr = 读历史();
  arr.unshift({ n: item.n, e: item.e || "🍽️", ts: Date.now() });
  写历史(arr);
  刷新历史();
}
function 读取自定义() {
  try {
    var raw = localStorage.getItem(LS_CUS);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function 保存自定义(arr) {
  try { localStorage.setItem(LS_CUS, JSON.stringify(arr.slice(0, 30))); } catch (e) {}
}

function 刷新历史() {
  var box = $("history");
  var arr = 读历史();
  if (arr.length === 0) {
    box.innerHTML = '<div class="none-tip">还没有记录哦～<br>转一次，命运就开始留痕了。</div>';
    return;
  }
  var today = new Date().toDateString();
  var html = "";
  for (var i = 0; i < Math.min(arr.length, 20); i++) {
    var h = arr[i];
    var d = new Date(h.ts);
    var isToday = d.toDateString() === today;
    var hh = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    html += '<div class="hist' + (isToday ? " today" : "") + '">' +
              '<span class="he">' + esc(h.e || "🍽️") + "</span>" +
              '<span class="hn">' + esc(h.n) + "</span>" +
              '<span class="ht">' + (isToday ? hh : (d.getMonth() + 1) + "/" + d.getDate() + " " + hh) + "</span>" +
            "</div>";
  }
  box.innerHTML = html;
}

function 刷新自定义列表() {
  var arr = 读取自定义();
  var box = $("customList");
  if (arr.length === 0) { box.innerHTML = ""; return; }
  box.innerHTML = arr.map(function (n, i) {
    return '<span class="cus">🍽️ ' + esc(n) + ' <b data-i="' + i + '" title="移除">×</b></span>';
  }).join("");
  Array.prototype.forEach.call(box.querySelectorAll("b"), function (el) {
    el.onclick = function () {
      var i = parseInt(el.getAttribute("data-i"), 10);
      var a = 读取自定义();
      a.splice(i, 1);
      保存自定义(a);
      刷新自定义列表();
      刷新池子();
      toast("已从转盘移除 🗑️");
    };
  });
}

/* ==========================================================================
   UI 绑定
   ========================================================================== */
function 建口味按钮() {
  var box = $("chips");
  box.innerHTML = "";
  口味表.forEach(function (o) {
    var b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("data-k", o.k);
    b.innerHTML = '<span class="k">' + o.e + "</span>" + o.k;
    b.onclick = function () {
      切换口味(o.k, b);
    };
    box.appendChild(b);
  });
}
function 切换口味(k, el) {
  var i = 选中口味.indexOf(k);
  if (i >= 0) { 选中口味.splice(i, 1); el.setAttribute("data-on", "0"); }
  else { 选中口味.push(k); el.setAttribute("data-on", "1"); }
  刷新池子();
  if ($("optSound").checked) sfxTick(0.9);   // 复用咔哒声，懒得很合理
}

function toast(msg) {
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(zzz);
  zzz = setTimeout(function () { t.classList.remove("on"); }, 2200);
}

setTimeout(function () {
  // 等等，先别急着绑定，等 DOM 都到齐（其实已经到齐了，习惯了）
  建口味按钮();
  刷新自定义列表();
  刷新历史();
  刷新池子();
  fitCanvas();
  paint(0);
  setTimeout(function () {
    paint(0);           // 再来一次，防止某些浏览器首次测量为 0（真的遇到过）
  }, 60);
  $("hub").classList.add("pulse");
}, 0);

$("hub").onclick = function () { 开转(false); };
$("btnAll").onclick = function () {
  选中口味 = ["酸","甜","辣","咸"];
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (c) { c.setAttribute("data-on", "1"); });
  刷新池子();
  toast("好的，全都要（胃：你冷静点）");
};
$("btnRandom").onclick = function () {
  var k = 口味表[rnd(口味表.length)].k;
  选中口味 = [k];
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (c) {
    c.setAttribute("data-on", c.getAttribute("data-k") === k ? "1" : "0");
  });
  刷新池子();
  toast("今天想吃「" + k + "」的，安排 🎲");
};
$("btnClear").onclick = function () {
  选中口味 = [];
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (c) { c.setAttribute("data-on", "0"); });
  刷新池子();
  toast("随便也行，那就不挑了 🙂");
};
$("btnCustom").onclick = function () {
  var v = $("customInput").value.trim();
  if (!v) { toast("先写个菜名吧 😋"); return; }
  var arr = 读取自定义();
  if (arr.indexOf(v) >= 0) { toast("这个已经在盘里了"); return; }
  if (菜品库.some(function (x) { return x.n === v; })) { toast("菜库里已经有它了，不用重复加"); }
  arr.push(v);
  保存自定义(arr);
  $("customInput").value = "";
  刷新自定义列表();
  刷新池子();
  toast("已加入转盘：「" + v + "」✨");
};
$("customInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") $("btnCustom").click();
});
$("optSound").addEventListener("change", function () {
  if (this.checked) { sfxTick(0.5); toast("音效已开 🔊"); } else toast("音效已关 🔇");
});
$("optConfetti").addEventListener("change", function () {
  toast(this.checked ? "撒花已开 🎉" : "撒花已关（安静模式）");
});
$("optAvoid").addEventListener("change", function () {
  刷新池子();
  toast(this.checked ? "会避开最近 3 次吃过的 🙈" : "不再避开了，随缘");
});
$("optLock").addEventListener("change", function () {
  if (!this.checked) lock = false;
  toast(this.checked ? "选中后会锁定转盘 🔒" : "锁定已解除 🔓");
});
$("btnClearHist").onclick = function () {
  if (!confirm("确定清空所有历史记录吗？（那些都是你做过的决定）")) return;
  写历史([]);
  刷新历史();
  toast("历史已清空，从今天重新开始");
};

window.addEventListener("resize", function () {
  fitCanvas();
  paint(god.rot || 0);
});
document.addEventListener("keydown", function (e) {
  if (e.code === "Space" || e.key === " ") {
    e.preventDefault();
    if (!转动中) 开转(false);
  }
});
